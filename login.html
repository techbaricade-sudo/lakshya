<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Lakshya Academy Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#0f172a
);

}

.bg{

position:fixed;

width:100%;

height:100%;

overflow:hidden;

}

.circle{

position:absolute;

border-radius:50%;

filter:blur(60px);

animation:float 12s infinite;

opacity:.45;

}

.c1{

width:280px;

height:280px;

background:#2563eb;

top:-80px;

left:-50px;

}

.c2{

width:250px;

height:250px;

background:#9333ea;

right:-80px;

bottom:-60px;

animation-delay:3s;

}

.c3{

width:200px;

height:200px;

background:#06b6d4;

left:40%;

top:60%;

animation-delay:6s;

}

@keyframes float{

0%,100%{

transform:
translateY(0px)
translateX(0px);

}

50%{

transform:
translateY(-50px)
translateX(30px);

}

}

.card{

width:420px;

max-width:95%;

padding:40px;

border-radius:25px;

background:

rgba(
255,
255,
255,
0.08
);

backdrop-filter:

blur(20px);

border:

1px solid rgba(
255,
255,
255,
0.15
);

box-shadow:

0 25px 50px rgba(
0,
0,
0,
0.4
);

color:white;

z-index:5;

}

.logo{

text-align:center;

font-size:40px;

margin-bottom:10px;

animation:pulse 2s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.08);

}

}

h1{

text-align:center;

margin-bottom:5px;

}

.subtitle{

text-align:center;

opacity:.7;

margin-bottom:30px;

}

.input{

margin-bottom:18px;

position:relative;

}

.input input{

width:100%;

padding:16px;

border:none;

outline:none;

border-radius:12px;

background:

rgba(
255,
255,
255,
0.12
);

color:white;

font-size:15px;

}

.input input::placeholder{

color:#d0d0d0;

}

.eye{

position:absolute;

right:15px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:600;

cursor:pointer;

background:#2563eb;

color:white;

transition:.3s;

}

button:hover{

transform:translateY(-2px);

}

.error{

margin-top:15px;

text-align:center;

color:#ffb4b4;

}

@media(max-width:500px){

.card{

padding:28px;

}

}

</style>

</head>

<body>

<div class="bg">

<div class="circle c1"></div>

<div class="circle c2"></div>

<div class="circle c3"></div>

</div>

<div class="card">

<div class="logo">🎓</div>

<h1>Lakshya Academy</h1>

<div class="subtitle">

Unified ERP Portal

</div>

<form id="loginForm">

<div class="input">

<input
type="email"
id="loginEmail"
placeholder="Email Address"
required>

</div>

<div class="input">

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<span
class="eye"
id="togglePass">

👁

</span>

</div>

<button
id="loginBtn">

Secure Sign In

</button>

<div
class="error"
id="err">

</div>

</form>

</div>

<script type="module">

import {
initializeApp
}

from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {

getAuth,

signInWithEmailAndPassword,

setPersistence,

browserLocalPersistence

}

from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {

getFirestore,

doc,

getDoc

}

from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyAeADgbpp6FSStuLd1KLoCNzcTlfuQDuw4",

authDomain:
"lakshya-academy-fdfb7.firebaseapp.com",

projectId:
"lakshya-academy-fdfb7",

storageBucket:
"lakshya-academy-fdfb7.firebasestorage.app",

messagingSenderId:
"783967143214",

appId:
"1:783967143214:web:daed9ed31f049f068aa6bf"

};

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);

document
.getElementById("togglePass")

.addEventListener(

"click",

()=>{

const p=
document.getElementById(
"loginPassword"
);

p.type=

p.type==="password"

?

"text"

:

"password";

}

);

document

.getElementById(
"loginForm"
)

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

const btn=
document.getElementById(
"loginBtn"
);

const err=
document.getElementById(
"err"
);

err.innerHTML="";

btn.disabled=true;

btn.innerHTML=
"Verifying...";

try{

await setPersistence(
auth,
browserLocalPersistence
);

const email=
loginEmail.value.trim();

const pass=
loginPassword.value;

const user=

await signInWithEmailAndPassword(

auth,

email,

pass

);

const uid=
user.user.uid;

const snap=

await getDoc(

doc(
db,
"users",
uid
)

);

if(
!snap.exists()
){

throw new Error(
"Profile Missing"
);

}

const role=
snap.data().role;

btn.innerHTML=
"Redirecting...";

if(
role==="admin"
){

window.location.replace(
"admin.html"
);

}

else if(
role==="faculty"
){

window.location.replace(
"faculty.html"
);

}

else if(
role==="student"
){

window.location.replace(
"student.html"
);

}

else{

throw new Error(
"Role Error"
);

}

}

catch(error){

btn.disabled=false;

btn.innerHTML=
"Secure Sign In";

if(
error.code==="auth/invalid-credential"
){

err.innerHTML=
"Incorrect Email or Password";

}

else{

err.innerHTML=
error.message;

}

}

}

);

</script>

</body>

</html>
